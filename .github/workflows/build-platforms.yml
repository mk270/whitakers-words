name: Build platform binaries

# Builds binaries and uploads them as workflow-run artifacts (NOT release
# assets). Nothing here touches any GitHub Release; that wiring comes
# later, once these are proven. Starting with Linux only; Windows and
# macOS jobs will be added once this one is solid.

on:
  push:
    branches: [rel-mgmt]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update apt cache
        run: |
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"

      - name: Install build dependencies
        run: sudo apt-get install -y gnat gprbuild

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package
        run: |
          pkg="whitakers-words-linux-x86_64"
          mkdir -p "$pkg"/bin
          cp -a bin/words bin/meanings "$pkg"/bin/
          cp DICTFILE.GEN STEMFILE.GEN INDXFILE.GEN INFLECTS.SEC EWDSFILE.GEN \
             UNIQUES.LAT ADDONS.LAT README.md LICENCE.txt HOWTO.txt "$pkg"/
          tar czf "${pkg}.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: whitakers-words-linux-x86_64
          path: whitakers-words-linux-x86_64.tar.gz
