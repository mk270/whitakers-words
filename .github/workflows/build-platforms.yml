name: Build platform binaries

# Builds binaries and uploads them as workflow-run artifacts.

on:
  push:
    branches: [rel-mgmt]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update apt cache
        run: |
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"

      - name: Install build dependencies
        run: sudo apt-get install -y gnat gprbuild

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package
        run: |
          pkg="whitakers-words-linux-x86_64"
          mkdir -p "$pkg"/bin
          cp -a bin/words bin/meanings "$pkg"/bin/
          cp DICTFILE.GEN STEMFILE.GEN INDXFILE.GEN INFLECTS.SEC EWDSFILE.GEN \
             UNIQUES.LAT ADDONS.LAT README.md LICENCE.txt HOWTO.txt "$pkg"/
          tar czf "${pkg}.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: whitakers-words-linux-x86_64
          path: whitakers-words-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships Git Bash (sed/diff/tar/etc.) but not
      # GNU Make, which this project's build depends on throughout.
      - name: Install make
        run: choco install make -y

      # Install GNAT + gprbuild and put them on PATH directly.
      - uses: ada-actions/toolchain@dev
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        with:
          distrib: community
          target: native

      - name: Build
        run: make

      - name: Show startup banner
        run: printf 'atque\n\n' | ./bin/words.exe

      - name: Test
        run: make test

      - name: Package
        run: |
          pkg="whitakers-words-windows-x86_64"
          mkdir -p "$pkg"/bin
          cp bin/words.exe bin/meanings.exe "$pkg"/bin/
          cp DICTFILE.GEN STEMFILE.GEN INDXFILE.GEN INFLECTS.SEC EWDSFILE.GEN \
             UNIQUES.LAT ADDONS.LAT README.md LICENCE.txt HOWTO.txt "$pkg"/
          7z a "${pkg}.zip" "$pkg" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: whitakers-words-windows-x86_64
          path: whitakers-words-windows-x86_64.zip
