name: Build platform binaries

# Builds binaries and uploads them as workflow-run artifacts.

on:
  push:
    branches: [rel-mgmt]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update apt cache
        run: |
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"

      - name: Install build dependencies
        run: sudo apt-get install -y gnat gprbuild

      - name: Build
        run: make

      - name: Checksum generated data files
        run: |
          echo "-- binary (Direct_IO/Sequential_IO) files, raw checksum only --"
          for f in DICTFILE.GEN STEMFILE.GEN INFLECTS.SEC EWDSFILE.GEN; do
            echo "$f: $(sha256sum "$f" | cut -d' ' -f1)"
          done
          echo "-- text (Ada.Text_IO) files, raw and CRLF-stripped --"
          for f in EWDSLIST.GEN INDXFILE.GEN STEMLIST.GEN; do
            echo "$f raw:            $(sha256sum "$f" | cut -d' ' -f1)"
            echo "$f crlf-stripped:  $(tr -d '\r' < "$f" | sha256sum | cut -d' ' -f1)"
          done

      - name: Test
        run: make test

      - name: Package
        run: |
          pkg="whitakers-words-linux-x86_64"
          mkdir -p "$pkg"/bin
          cp -a bin/words bin/meanings "$pkg"/bin/
          cp DICTFILE.GEN STEMFILE.GEN INDXFILE.GEN INFLECTS.SEC EWDSFILE.GEN \
             UNIQUES.LAT ADDONS.LAT README.md LICENCE.txt HOWTO.txt "$pkg"/
          tar czf "${pkg}.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: whitakers-words-linux-x86_64
          path: whitakers-words-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships Git Bash (sed/diff/tar/etc.) but not
      # GNU Make, which this project's build depends on throughout.
      - name: Install make
        run: choco install make -y

      # Installs GNAT + gprbuild. Its own PATH-setting relies on a legacy
      # command GitHub disables by default, so it's expected to report
      # failure here even though the install itself succeeds; the next
      # step adds the installed compiler to PATH ourselves.
      - uses: ada-actions/toolchain@d6c5b8a6e7d5205b96948c84f66a2d3fe3a24707
        continue-on-error: true
        with:
          distrib: community
          target: native

      - name: Add GNAT to PATH
        run: |
          gnat_dir=$(find "$RUNNER_TEMP" -maxdepth 1 -iname 'gnat-community-*' -print -quit)
          echo "$gnat_dir/bin" >> "$GITHUB_PATH"

      - name: Build
        run: make

      - name: Checksum generated data files
        run: |
          echo "-- binary (Direct_IO/Sequential_IO) files, raw checksum only --"
          for f in DICTFILE.GEN STEMFILE.GEN INFLECTS.SEC EWDSFILE.GEN; do
            echo "$f: $(sha256sum "$f" | cut -d' ' -f1)"
          done
          echo "-- text (Ada.Text_IO) files, raw and CRLF-stripped --"
          for f in EWDSLIST.GEN INDXFILE.GEN STEMLIST.GEN; do
            echo "$f raw:            $(sha256sum "$f" | cut -d' ' -f1)"
            echo "$f crlf-stripped:  $(tr -d '\r' < "$f" | sha256sum | cut -d' ' -f1)"
          done

      - name: Show startup banner
        run: printf 'atque\n\n' | ./bin/words.exe

      - name: Test
        run: make test

      - name: Package
        run: |
          pkg="whitakers-words-windows-x86_64"
          mkdir -p "$pkg"/bin
          cp bin/words.exe bin/meanings.exe "$pkg"/bin/
          cp DICTFILE.GEN STEMFILE.GEN INDXFILE.GEN INFLECTS.SEC EWDSFILE.GEN \
             UNIQUES.LAT ADDONS.LAT README.md LICENCE.txt HOWTO.txt "$pkg"/
          7z a "${pkg}.zip" "$pkg" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: whitakers-words-windows-x86_64
          path: whitakers-words-windows-x86_64.zip
